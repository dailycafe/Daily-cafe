<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Cafe • Stock Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#29231f;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:#f2c400;color:#241d00;padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #00000018}.brand{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:25px}.brand small{opacity:.75}
main{max-width:900px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{border:0;background:#f6e7a3;padding:11px 15px;border-radius:12px;white-space:nowrap;font-weight:800}.tab.active{background:#f2c400;color:#241d00}.page{display:none}.page.active{display:block}
.datebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;padding:15px;border-radius:15px;box-shadow:0 2px 10px #0000000c;border-top:4px solid #f2c400}.stat b{font-size:24px}.stat span{display:block;color:#777;font-size:12px;margin-top:3px}
.card{background:#fff;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0000000c}.card.low-card{border-left:5px solid #f2c400;background:#fffdf2}.card.out-card{border-left:5px solid #d62828;background:#fff7f7}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-weight:800;font-size:16px}.sub{color:#777;font-size:12px;margin-top:3px}.controls{display:flex;align-items:center;gap:6px}.controls button,.iconbtn{border:0;border-radius:9px;background:#eee;width:34px;height:34px;font-size:19px}.qty{width:70px;padding:8px;border:1px solid #ddd;border-radius:9px;text-align:center;font-size:15px}.status{font-size:11px;font-weight:900;margin-top:10px;display:inline-block;padding:5px 9px;border-radius:20px}.ok{color:#176b35;background:#e8f7ed}.low{color:#8a6500;background:#fff0a8}.out{color:#a51e1e;background:#ffdede}.actions{display:flex;gap:9px;margin-top:15px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:800}.primary{background:#f2c400;color:#241d00}.secondary{background:#f6e7a3;color:#3b3100}
input,select{font:inherit;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff;width:100%}.form{display:grid;grid-template-columns:1.2fr 100px 110px 1fr;gap:8px}.search{margin-bottom:10px}.notice{padding:12px;border-radius:12px;background:#fff0a8;color:#6d5400;margin:10px 0;font-size:13px;font-weight:700}.historyItem{border-left:4px solid #f2c400;padding:10px 12px;background:#fff;margin:8px 0;border-radius:10px}.muted{color:#777;font-size:12px}
.category{margin:18px 0}.category-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f2c400;border-radius:14px;padding:11px 13px;font-weight:900}.category-head small{font-weight:700;background:#fff3bd;padding:4px 8px;border-radius:20px}.category-items{margin-top:6px}.editgrid{display:grid;grid-template-columns:1.2fr 90px 110px 1fr 1fr;gap:7px;align-items:center}.editgrid button{border:0;border-radius:9px;padding:10px;font-weight:800}.danger{background:#ffe0e0;color:#a51e1e}.mini{font-size:12px}.sync{font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px;background:#fff3bd}.sync.ok{background:#e8f7ed;color:#176b35}.sync.wait{background:#fff0a8;color:#8a6500}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/-1}.editgrid{grid-template-columns:1fr 1fr}.editgrid button{grid-column:span 1}}
</style>
</head>
<body>
<header><div class="brand"><div><h1>☕ Daily Cafe</h1><small>Stock Management</small></div><div><div id="today"></div><div id="syncState" class="sync wait">Connecting…</div></div></div></header>
<main>
<div class="tabs"><button class="tab active" data-page="dashboard">Dashboard</button><button class="tab" data-page="stock">Daily Stock</button><button class="tab" data-page="history">History</button><button class="tab" data-page="items">Items</button></div>
<section id="dashboard" class="page active"><div class="grid"><div class="stat"><b id="total">0</b><span>Total Items</span></div><div class="stat"><b id="low">0</b><span>Low Stock</span></div><div class="stat"><b id="out">0</b><span>Out of Stock</span></div></div><div id="alert"></div><div class="card"><b>Today's Update</b><p class="muted">Update remaining quantities after work and save the day's stock.</p><button class="actions primary" onclick="go('stock')">Update Stock →</button></div><div id="dashCategories"></div></section>
<section id="stock" class="page"><div class="datebar"><b>Today's Stock</b><span class="muted" id="stockDate"></span></div><input class="search" id="search" placeholder="🔎 Search item or category..." oninput="renderStock()"><div id="stockList"></div><div class="actions"><button class="primary" onclick="saveToday()">✓ Save Today's Stock</button><button class="secondary" onclick="resetToday()">Reset</button></div></section>
<section id="history" class="page"><div class="datebar"><b>Saved History</b><button class="secondary" onclick="clearHistory()">Clear History</button></div><div id="historyList"></div></section>
<section id="items" class="page"><div class="card"><b>Add New Item</b><div class="form" style="margin-top:10px"><input id="newName" placeholder="Item name"><input id="newQty" type="number" min="0" step=".5" placeholder="Qty"><input id="newUnit" placeholder="Unit"><select id="newCategory"></select><input id="newExtra" placeholder="Extra (optional)"><button class="primary" onclick="addItem()">+ Add Item</button></div></div><div class="card"><div class="row"><div><b>Categories</b><div class="muted">Add sections like Juice Stocks, Packet Foods, Frozen Stocks, etc.</div></div></div><div class="form" style="margin-top:10px;grid-template-columns:1fr 120px"><input id="newCategoryName" placeholder="New category name"><button class="primary" onclick="addCategory()">+ Add Section</button></div><div id="categoryManager"></div></div><div id="itemManager"></div></section>
</main>
<script>
const defaultCategories=["Juice Stocks","Packet Foods","Frozen Stocks"];
const defaults=[
{name:"French Fries",qty:2.5,unit:"packet",extra:"5 nos",category:"Frozen Stocks"},
{name:"Nuggets",qty:2,unit:"packet",extra:"",category:"Frozen Stocks"},
{name:"Pops",qty:3,unit:"packet",extra:"",category:"Frozen Stocks"},
{name:"Chicken Patty",qty:3,unit:"packet",extra:"",category:"Frozen Stocks"},
{name:"Veg Patty",qty:3,unit:"packet",extra:"",category:"Frozen Stocks"},
{name:"Momos",qty:5,unit:"packet",extra:"",category:"Frozen Stocks"}];
let categories=JSON.parse(localStorage.getItem("dc_categories")||"null")||defaultCategories.slice();
let raw=JSON.parse(localStorage.getItem("dc_items")||"null");
let items=raw||defaults.map(x=>({...x}));
items=items.map(x=>({...x,category:x.category||"Frozen Stocks",extra:x.extra||""}));
let key=new Date().toISOString().slice(0,10);
document.getElementById("today").textContent=new Date().toLocaleDateString(undefined,{day:"2-digit",month:"short"});
document.getElementById("stockDate").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.page));
function go(p){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(p).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.page===p));if(p==="history")renderHistory();if(p==="items")renderItems();renderAll()}
function saveLocal(){localStorage.setItem("dc_items",JSON.stringify(items));localStorage.setItem("dc_categories",JSON.stringify(categories));if(window.dailyCafeCloudSaveCurrent)window.dailyCafeCloudSaveCurrent(items,categories).catch(console.error)}
function state(q){return q===0?["out","OUT OF STOCK"]:q<=1?["low","LOW STOCK ⚠️"]:["ok","IN STOCK"]}
function grouped(){return categories.map(c=>({category:c,items:items.map((x,i)=>({...x,index:i})).filter(x=>x.category===c)})).concat([{category:"Other",items:items.map((x,i)=>({...x,index:i})).filter(x=>!categories.includes(x.category))}]).filter(g=>g.items.length)}
function renderStock(){let s=(document.getElementById("search").value||"").toLowerCase();let html="";grouped().forEach(g=>{let arr=g.items.filter(x=>x.name.toLowerCase().includes(s)||g.category.toLowerCase().includes(s));if(!arr.length)return;let attention=arr.filter(x=>x.qty<=1).length;html+=`<div class="category"><div class="category-head"><span>${g.category}</span><small>${arr.length} item(s)${attention?" • ⚠️ "+attention+" need attention":""}</small></div><div class="category-items">`;arr.forEach(x=>{let [cl,tx]=state(x.qty);let card=cl==="low"?"low-card":cl==="out"?"out-card":"";html+=`<div class="card ${card}"><div class="row"><div><div class="name">${x.name}</div><div class="sub">${x.unit}${x.extra?" • "+x.extra:""}</div></div><div class="controls"><button onclick="change(${x.index},-.5)">−</button><input class="qty" type="number" min="0" step=".5" value="${x.qty}" onchange="setQty(${x.index},this.value)"><button onclick="change(${x.index},.5)">+</button></div></div><div class="status ${cl}">${tx}</div></div>`});html+="</div></div>"});document.getElementById("stockList").innerHTML=html||'<div class="card">No items found.</div>'}
function renderDashboard(){let low=items.filter(x=>x.qty>0&&x.qty<=1).length,out=items.filter(x=>x.qty===0).length;document.getElementById("total").textContent=items.length;document.getElementById("low").textContent=low;document.getElementById("out").textContent=out;document.getElementById("alert").innerHTML=(low+out)?`<div class="notice">⚠️ ${low} low-stock and ${out} out-of-stock item(s) need attention.</div>`:"";document.getElementById("dashCategories").innerHTML=grouped().map(g=>`<div class="card"><div class="row"><b>${g.category}</b><span class="muted">${g.items.length} item(s) • ${g.items.filter(x=>x.qty<=1).length} attention</span></div></div>`).join("")}
function renderAll(){renderStock();renderDashboard()}
function change(i,d){items[i].qty=Math.max(0,Math.round((items[i].qty+d)*2)/2);saveLocal();renderAll()}
function setQty(i,v){items[i].qty=Math.max(0,Number(v)||0);saveLocal();renderAll()}
async function saveToday(){saveLocal();let snapshot=JSON.parse(JSON.stringify(items));let h=JSON.parse(localStorage.getItem("dc_history")||"[]");h=h.filter(x=>x.date!==key);h.unshift({date:key,items:snapshot});localStorage.setItem("dc_history",JSON.stringify(h));try{if(window.dailyCafeCloudSaveToday)await window.dailyCafeCloudSaveToday(snapshot,key);alert("Today's stock saved ✓")}catch(e){console.error(e);alert("Saved on this device ✓ (cloud sync failed)")}}
function renderHistory(){let h=JSON.parse(localStorage.getItem("dc_history")||"[]");document.getElementById("historyList").innerHTML=h.length?h.map(x=>`<div class="historyItem"><b>${x.date}</b><div class="muted">${x.items.map(i=>i.name+": "+i.qty+" "+i.unit).join(" • ")}</div></div>`).join(""):"<div class='card'>No saved days yet.</div>"}
function clearHistory(){if(confirm("Clear all saved history?")){localStorage.removeItem("dc_history");renderHistory()}}
function resetToday(){if(confirm("Reset today's quantities to the starting list?")){items=defaults.map(x=>({...x}));categories=defaultCategories.slice();saveLocal();renderAll();renderItems()}}
function fillCategorySelect(){let s=document.getElementById("newCategory");s.innerHTML=categories.map(c=>`<option>${c}</option>`).join("")||'<option>Other</option>'}
function addItem(){let n=document.getElementById("newName").value.trim(),q=Number(document.getElementById("newQty").value)||0,u=document.getElementById("newUnit").value.trim()||"packet",c=document.getElementById("newCategory").value||"Other",e=document.getElementById("newExtra").value.trim();if(!n)return alert("Enter item name");items.push({name:n,qty:q,unit:u,extra:e,category:c});saveLocal();["newName","newQty","newUnit","newExtra"].forEach(id=>document.getElementById(id).value="");renderItems();renderAll()}
function addCategory(){let n=document.getElementById("newCategoryName").value.trim();if(!n)return alert("Enter category name");if(categories.some(c=>c.toLowerCase()===n.toLowerCase()))return alert("Category already exists");categories.push(n);document.getElementById("newCategoryName").value="";saveLocal();renderItems();renderAll()}
function editItem(i){let x=items[i];let n=prompt("Item name",x.name);if(n===null)return;let q=prompt("Quantity",x.qty);if(q===null)return;let u=prompt("Unit",x.unit);if(u===null)return;let c=prompt("Category",x.category);if(c===null)return;let e=prompt("Extra note (optional)",x.extra||"");if(e===null)return;if(c.trim()&&!categories.includes(c.trim()))categories.push(c.trim());items[i]={...x,name:n.trim()||x.name,qty:Math.max(0,Number(q)||0),unit:u.trim()||x.unit,category:c.trim()||x.category,extra:e.trim()};saveLocal();renderItems();renderAll()}
function renderItems(){fillCategorySelect();document.getElementById("categoryManager").innerHTML=categories.map((c,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #eee"><span><b>${c}</b> <span class="muted">(${items.filter(x=>x.category===c).length})</span></span><button class="iconbtn" onclick="renameCategory(${i})">✏️</button></div>`).join("");document.getElementById("itemManager").innerHTML=items.map((x,i)=>`<div class="card"><div class="row"><div><b>${x.name}</b><div class="muted">${x.category} • ${x.qty} ${x.unit}${x.extra?" • "+x.extra:""}</div></div><div style="display:flex;gap:6px"><button class="iconbtn" onclick="editItem(${i})">✏️</button><button class="iconbtn" onclick="deleteItem(${i})">🗑️</button></div></div></div>`).join("")}
function renameCategory(i){let n=prompt("Category name",categories[i]);if(n===null||!n.trim())return;let old=categories[i],neu=n.trim();if(categories.some((c,j)=>j!==i&&c.toLowerCase()===neu.toLowerCase()))return alert("Category already exists");categories[i]=neu;items.forEach(x=>{if(x.category===old)x.category=neu});saveLocal();renderItems();renderAll()}
function deleteItem(i){if(confirm("Remove "+items[i].name+"?")){items.splice(i,1);saveLocal();renderItems();renderAll()}}
renderItems();renderAll();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDAN62n2m_hpzlVQ0yvTMfX13sHpibWGd4",authDomain:"daily-cafe-f2d07.firebaseapp.com",projectId:"daily-cafe-f2d07",storageBucket:"daily-cafe-f2d07.firebasestorage.app",messagingSenderId:"722886457899",appId:"1:722886457899:web:2b4d661a712830c9d4c86e",measurementId:"G-C78VG7WK3D"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),stockRef=doc(db,"stock","current");
window.dailyCafeCloudReady=false;
window.dailyCafeCloudSaveCurrent=async(items,categories)=>{if(!window.dailyCafeCloudReady)return;await setDoc(stockRef,{items,categories,updatedAt:Date.now()},{merge:true})};
window.dailyCafeCloudSaveToday=async(items,date)=>{await setDoc(stockRef,{items,categories,updatedAt:Date.now()},{merge:true});await setDoc(doc(db,"history",date),{date,items,savedAt:Date.now()})};
try{await signInAnonymously(auth);window.dailyCafeCloudReady=true;document.getElementById("syncState").textContent="☁️ Synced";document.getElementById("syncState").className="sync ok";let snap=await getDoc(stockRef);if(snap.exists()&&Array.isArray(snap.data().items)){items=snap.data().items.map(x=>({...x,category:x.category||"Frozen Stocks",extra:x.extra||""}));if(Array.isArray(snap.data().categories)&&snap.data().categories.length)categories=snap.data().categories;saveLocal();renderItems();renderAll()}
onSnapshot(stockRef,s=>{if(!s.exists()||!Array.isArray(s.data().items))return;let data=s.data();items=data.items.map(x=>({...x,category:x.category||"Frozen Stocks",extra:x.extra||""}));if(Array.isArray(data.categories)&&data.categories.length)categories=data.categories;localStorage.setItem("dc_items",JSON.stringify(items));localStorage.setItem("dc_categories",JSON.stringify(categories));renderItems();renderAll()});
}catch(e){console.error(e);document.getElementById("syncState").textContent="Offline mode";document.getElementById("syncState").className="sync wait"}
</script>
</body></html>
